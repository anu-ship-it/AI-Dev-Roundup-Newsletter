services:

  scraper:
    build: ./scraper
    env_file:
      - ./scraper/.env
    volumes:
      - ./scraper/src:/app/src

  ai-pipeline:
    build: ./ai-pipeline
    env_file:
      - ./ai-pipeline/.env
    volumes:
      - ./ai-pipeline/src:/app/src
    depends_on:
      scraper:
        condition: service_completed_successfully

  email:
    build: ./email
    env_file:
      - ./email/.env
    volumes:
      - ./email/src:/app/src
    depends_on:
      ai-pipeline:
        condition: service_completed_successfully